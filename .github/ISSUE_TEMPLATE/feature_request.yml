name: 💡 Feature request
description: Suggest a new county, metric, model, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or analytical question that's currently hard to answer.
      placeholder: I'd like to track which trustees are most active so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed? (e.g. a new dbt mart, a new county, a dashboard tile)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
