<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="SoCal NOD Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a22"/>
      <stop offset="0.55" stop-color="#1b202b"/>
      <stop offset="1" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#8ab4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#f4a142"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="15" fill="none" stroke="#2a3140" stroke-width="2"/>

  <!-- subtle grid lines, echoing the dashboard -->
  <g stroke="#222936" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>

  <!-- decorative bar chart motif (right side) -->
  <g opacity="0.9">
    <rect x="905"  y="150" width="34" height="120" rx="4" fill="#4285f4"/>
    <rect x="955"  y="180" width="34" height="90"  rx="4" fill="#5b9dff"/>
    <rect x="1005" y="120" width="34" height="150" rx="4" fill="#f4a142"/>
    <rect x="1055" y="200" width="34" height="70"  rx="4" fill="#8a7dff"/>
    <rect x="1105" y="170" width="34" height="100" rx="4" fill="#9ccc65"/>
    <rect x="1155" y="210" width="34" height="60"  rx="4" fill="#5b9dff"/>
  </g>

  <!-- title block -->
  <text x="80" y="140" font-size="62" font-weight="700" fill="url(#title)">SoCal NOD Tracker</text>
  <text x="82" y="190" font-size="26" font-weight="500" fill="#c4ccd8">Notice of Default filings across Southern California</text>
  <text x="82" y="226" font-size="20" font-weight="400" fill="#7d8794">A leading indicator of foreclosure activity &#183; end-to-end data pipeline</text>

  <!-- accent underline -->
  <rect x="82" y="248" width="430" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- tech footer pills -->
  <g font-size="17" font-weight="600">
    <g transform="translate(82,278)">
      <rect width="64"  height="30" rx="15" fill="#222b3a"/><text x="32"  y="20" text-anchor="middle" fill="#9bb6e8">GCP</text>
    </g>
    <g transform="translate(156,278)">
      <rect width="104" height="30" rx="15" fill="#222b3a"/><text x="52"  y="20" text-anchor="middle" fill="#9bb6e8">Terraform</text>
    </g>
    <g transform="translate(270,278)">
      <rect width="96"  height="30" rx="15" fill="#222b3a"/><text x="48"  y="20" text-anchor="middle" fill="#9bb6e8">BigQuery</text>
    </g>
    <g transform="translate(376,278)">
      <rect width="56"  height="30" rx="15" fill="#222b3a"/><text x="28"  y="20" text-anchor="middle" fill="#9bb6e8">dbt</text>
    </g>
    <g transform="translate(442,278)">
      <rect width="116" height="30" rx="15" fill="#222b3a"/><text x="58"  y="20" text-anchor="middle" fill="#9bb6e8">Looker Studio</text>
    </g>
  </g>
</svg>
